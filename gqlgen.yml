# Where are all the schema files located? globs are supported eg  src/**/*.graphqls
schema:
  - graphql/schema.graphqls
  - graphql/user.graphqls
  - graphql/category.graphqls
  - graphql/city.graphqls
  - graphql/country.graphqls
  - graphql/booking.graphqls
  - graphql/package.graphqls
  - graphql/state.graphqls
  - graphql/tour.graphqls
  - graphql/poi.graphqls
  - graphql/mail.graphqls

# Where should the generated server code go?
exec:
  filename: graphql/generated/generated.go
  package: generated

# Uncomment to enable federation
# federation:
#   filename: graphql/federation.go
#   package: graphql

# Where should any generated models go?
model:
  filename: graphql/models/models_gen.go
  package: models

# Where should the resolver implementations go?
resolver:
  layout: follow-schema
  dir: graphql
  package: graphql

# Optional: turn on use ` + "`" + ` + "`" + `go run` + "`" + ` + "`" + ` to run your server
# autobind:
#   - "graphql/models"

# gqlgen will search for any type names in the schema in these packages
# if they match it will use them, otherwise it will generate them.
autobind:
  - "graphql/internal/db"

# This section declares type mapping between the GraphQL and go type systems
#
# The first line in each type will be used as defaults for the resolver generation and
# type checking. To specify a value to serialize to/from, specify it as value: e.g.
#
# Time:
#   model: github.com/99designs/gqlgen/graphql.Time
models:
  UUID:
    model:
      - github.com/99designs/gqlgen/graphql.UUID
  Time:
    model: github.com/99designs/gqlgen/graphql.Time
  User:
    model: graphql/internal/db.User
  Package:
    model: graphql/internal/db.Package
  Booking:
    model: graphql/internal/db.Booking
  Category:
    model: graphql/internal/db.Category
  POI:
    model: graphql/internal/db.PointsOfInterest
  POIImage:
    model: graphql/internal/db.PointOfInterestImage

