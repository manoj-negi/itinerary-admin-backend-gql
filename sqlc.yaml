version: "2"
sql:
  - schema: "db/schema.sql"
    queries:
      - "db/category_queries.sql"
      - "db/tour_queries.sql"
      - "db/user_queries.sql"
      - "db/country_queries.sql"
      - "db/state_queries.sql"
      - "db/city_queries.sql"
      - "db/package_queries.sql"
      - "db/booking_queries.sql"
      - "db/tour_image_queries.sql"
      - "db/point_of_interest_queries.sql"
      - "db/point_of_interest_image_queries.sql"
      - "db/category_image_queries.sql"
      - "db/package_image_queries.sql"
      - "db/role_queries.sql"
   

    engine: "postgresql"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "database/sql"
        emit_json_tags: true
        emit_empty_slices: true

